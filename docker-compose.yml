version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: mindcare_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: mindcare
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: mindcare_qdrant
    restart: always
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: mindcare_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/mindcare
      VECTOR_DATABASE_URL: http://qdrant:6333
      VECTOR_COLLECTION: mental_health_knowledge
      JWT_SECRET: super-secret-mindcare-key-change-in-production-2024-jwt
      LLM_PROVIDER: gemini
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      FRONTEND_URL: http://localhost:5173
    ports:
      - "8000:8000"

volumes:
  postgres_data:
  qdrant_data:

